name: Promote release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft tag
        required: true
        type: string
      source_sha:
        description: Exact source SHA recorded by the candidate build
        required: true
        type: string
      channel:
        description: Must match the draft channel
        required: true
        type: choice
        options:
          - internal-unsigned
          - public-beta
      approval:
        description: Type PROMOTE followed by a space and the tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promotion-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  promote:
    name: Verify and publish ${{ inputs.tag }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.channel == 'public-beta' && 'public-beta' || 'internal-beta' }}
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - name: Check out protected controller logic
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Validate independent promotion request
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.approval }}" = "PROMOTE ${{ inputs.tag }}" || { echo '::error::approval phrase does not match the requested tag'; exit 1; }
          [[ "${{ inputs.tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || { echo '::error::invalid release tag'; exit 1; }
          [[ "${{ inputs.source_sha }}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo '::error::source_sha must be a full immutable commit SHA'; exit 1; }
      - name: Verify draft identity and download assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "${{ inputs.tag }}" --json tagName,isDraft,isPrerelease,body > "$RUNNER_TEMP/release.json"
          RELEASE_JSON="$RUNNER_TEMP/release.json" EXPECTED_TAG="${{ inputs.tag }}" EXPECTED_SHA="${{ inputs.source_sha }}" EXPECTED_CHANNEL="${{ inputs.channel }}" node - <<'NODE'
          const fs = require('node:fs')
          const release = JSON.parse(fs.readFileSync(process.env.RELEASE_JSON, 'utf8'))
          if (release.tagName !== process.env.EXPECTED_TAG) throw new Error('draft tag does not match')
          if (!release.isDraft || !release.isPrerelease) throw new Error('candidate must still be a draft prerelease')
          if (!release.body.includes(`Source: clarityaui/main@${process.env.EXPECTED_SHA}`)) throw new Error('draft source SHA does not match')
          if (!release.body.includes(`Channel: ${process.env.EXPECTED_CHANNEL}`)) throw new Error('draft channel does not match')
          NODE
          mkdir candidate
          gh release download "${{ inputs.tag }}" --dir candidate
      - name: Validate every published claim and checksum
        run: node scripts/validate-manifest.mjs candidate/release-manifest.json candidate "${{ inputs.tag }}" "${{ inputs.source_sha }}" "${{ inputs.channel }}"
      - name: Enforce public signing boundary
        if: inputs.channel == 'public-beta'
        shell: bash
        run: |
          node - <<'NODE'
          const manifest = require('./candidate/release-manifest.json')
          for (const id of ['windows', 'macos']) {
            const platform = manifest.platforms.find((item) => item.id === id)
            if (!platform || platform.signed !== true || platform.verified !== true) {
              throw new Error(`${id} is not recorded as signed and verified`)
            }
          }
          NODE
      - name: Publish verified prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ inputs.tag }}" --draft=false --prerelease
