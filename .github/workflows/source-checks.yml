name: Source checks

# Run the private source's guard suite on every operating system it ships to, WITHOUT packaging or publishing.
#
# ⚠⚠⚠ WHY THIS LIVES IN THE PUBLIC CONTROLLER. `clarityaui/main` is private, so its Actions minutes are billed —
#     macOS at 10x — and a payment problem there blocks all of it. This repository is PUBLIC, and GitHub does not
#     bill standard runners in public repositories, so the same suite on the same six platforms costs nothing.
#     Measured 2026-09-21: while every private-repo run failed in ~3s on a billing refusal, a public-repo run
#     succeeded in 11s — same account, same minute.
#
# ⚠⚠ THE LOGS OF A PUBLIC REPOSITORY ARE PUBLIC. Guard names, file paths and failure diffs from a private source
#    are world-readable here. candidate.yml already had that property; this makes it routine, which was an
#    explicit decision (2026-09-21) and not an oversight. A guard must never echo a secret.
#
# This workflow packages NOTHING and has no publishing authority: `contents: read`, no signing secrets, no
# release. Cutting an actual candidate stays candidate.yml's job.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character commit SHA from clarityaui/main (blank = current head of main)
        required: false
        type: string
      only:
        description: Narrow to one platform family to spend less wall-clock on a targeted question
        required: false
        default: all
        type: choice
        options:
          - all
          - windows
          - macos
          - linux

permissions:
  contents: read

concurrency:
  # ⚠ Keyed on the leg selection as well as the ref: a narrowed run must not cancel a full one.
  group: source-checks-${{ github.ref }}-${{ inputs.only }}
  cancel-in-progress: true

env:
  SOURCE_OWNER: clarityaui
  SOURCE_REPO: main
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  resolve:
    name: Resolve the source commit and the legs
    runs-on: ubuntu-latest
    environment: source-read
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      matrix: ${{ steps.legs.outputs.matrix }}
    steps:
      # Resolved ONCE, on Linux, and passed to the legs. Doing it per-platform would need a JSON parser on every
      # runner image, and the Windows-on-ARM image is exactly where that assumption goes quiet.
      - name: Pick the commit under test
        id: pick
        shell: bash
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          REQUESTED: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPO_TOKEN"
          sha="$REQUESTED"
          if [ -z "$sha" ]; then
            sha=$(curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $SOURCE_REPO_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$SOURCE_OWNER/$SOURCE_REPO/commits/main" | jq -r '.sha')
          fi
          # ⚠ A run whose subject nobody can name is a green tick attached to nothing: refuse anything that is
          #   not a full immutable sha, and print the one that was chosen.
          printf '%s' "$sha" | grep -Eq '^[0-9a-fA-F]{40}$' || { echo "::error::not a 40-character source sha: '$sha'"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "checking clarityaui/main@$sha"
      # ⚠⚠⚠ THE LEGS ARE CHOSEN HERE, NOT IN THE SUITE JOB'S `if:`. The first cut narrowed with a job-level
      #     `if: … == matrix.family`, but a job's `if` is evaluated BEFORE its matrix expands and may not read
      #     `matrix` at all. GitHub refused the whole file, so no leg of this workflow ever ran; it registered
      #     under its path instead of its name. The matrix is now the selection itself. The list must equal
      #     candidate.yml's legs (the self-test compares them), so what is checked is what ships.
      - name: Choose the legs
        id: legs
        shell: bash
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          all='[
            {"os":"windows-latest","label":"windows-x64","family":"windows"},
            {"os":"windows-11-arm","label":"windows-arm64","family":"windows"},
            {"os":"macos-latest","label":"macos-arm64","family":"macos"},
            {"os":"macos-15-intel","label":"macos-x64","family":"macos"},
            {"os":"ubuntu-latest","label":"linux-x64","family":"linux"},
            {"os":"ubuntu-24.04-arm","label":"linux-arm64","family":"linux"}
          ]'
          legs=$(jq -c --arg only "${ONLY:-all}" '[.[] | select($only == "all" or .family == $only)]' <<<"$all")
          # ⚠ A selection that matched nothing would be a green run that measured nothing: refuse it.
          test "$(jq length <<<"$legs")" -gt 0 || { echo "::error::no leg matches '${ONLY}'"; exit 1; }
          echo "matrix={\"include\":$legs}" >> "$GITHUB_OUTPUT"
          jq -r '.[].label' <<<"$legs"

  suite:
    name: ${{ matrix.label }}
    needs: resolve
    runs-on: ${{ matrix.os }}
    environment: source-read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Download the exact private source without persisting credentials
        shell: bash
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPO_TOKEN"
          mkdir source
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $SOURCE_REPO_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -o source.tar.gz \
            "https://api.github.com/repos/$SOURCE_OWNER/$SOURCE_REPO/tarball/${{ needs.resolve.outputs.sha }}"
          tar -xzf source.tar.gz --strip-components=1 -C source
          rm -f source.tar.gz
          test -f source/package-lock.json
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install locked dependencies
        working-directory: source
        run: npm ci
      - name: Build the WASM parity prerequisite
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          rustup target add wasm32-wasip1
          npm run build:atlas
          export RUSTFLAGS="--remap-path-prefix=$HOME=/build --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo"
          cargo build --release --target wasm32-wasip1 --manifest-path packages/atlas-core/native/cluster/Cargo.toml
          cp packages/atlas-core/native/cluster/target/wasm32-wasip1/release/cluster.wasm packages/atlas-core/dist/cluster.wasm
      - name: Windows HUD diagnostic preflight
        if: matrix.family == 'windows'
        working-directory: source
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: npm run test:hud
      - name: Full guard suite
        working-directory: source
        shell: bash
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: ${{ matrix.family == 'linux' && 'xvfb-run -a npm test' || 'npm test' }}
