name: Build release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag; must equal v<package.json version>
        required: true
        type: string
      source_sha:
        description: Full 40-character commit SHA from clarityaui/main
        required: true
        type: string
      channel:
        description: Unsigned internal testing or fully signed public beta
        required: true
        default: internal-unsigned
        type: choice
        options:
          - internal-unsigned
          - public-beta
      acknowledgement:
        description: Type BUILD followed by a space and the tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: candidate-${{ inputs.tag }}
  cancel-in-progress: false

env:
  SOURCE_OWNER: clarityaui
  SOURCE_REPO: main
  NODE_OPTIONS: --max-old-space-size=6144
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

jobs:
  authorize:
    name: Validate immutable source
    runs-on: ubuntu-latest
    environment: ${{ inputs.channel == 'public-beta' && 'beta-signing' || 'source-read' }}
    timeout-minutes: 10
    steps:
      - name: Validate request and source ancestry
        shell: bash
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test "${{ inputs.acknowledgement }}" = "BUILD ${{ inputs.tag }}" || { echo '::error::acknowledgement does not match the requested tag'; exit 1; }
          [[ "${{ inputs.tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || { echo '::error::tag must be a semantic version beginning with v'; exit 1; }
          [[ "${{ inputs.source_sha }}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo '::error::source_sha must be a full immutable commit SHA'; exit 1; }
          test -n "$SOURCE_REPO_TOKEN" || { echo '::error::SOURCE_REPO_TOKEN is missing'; exit 1; }
          test -n "$VITE_SUPABASE_URL" && test -n "$VITE_SUPABASE_ANON_KEY" || { echo '::error::public Supabase build configuration is missing'; exit 1; }
          compare_url="https://api.github.com/repos/$SOURCE_OWNER/$SOURCE_REPO/compare/${{ inputs.source_sha }}...main"
          status=$(curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $SOURCE_REPO_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$compare_url" | jq -r '.status')
          test "$status" = ahead -o "$status" = identical || { echo "::error::source commit is not on main (compare status: $status)"; exit 1; }

  build:
    name: ${{ inputs.channel }} / ${{ matrix.label }}
    needs: authorize
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            label: windows
            target: win
          - os: macos-latest
            label: macos
            target: mac
          - os: ubuntu-latest
            label: linux
            target: linux
    runs-on: ${{ matrix.os }}
    environment: ${{ inputs.channel == 'public-beta' && 'beta-signing' || 'source-read' }}
    timeout-minutes: 90
    steps:
      - name: Download the exact private source without persisting credentials
        shell: bash
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPO_TOKEN"
          mkdir source
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $SOURCE_REPO_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -o source.tar.gz \
            "https://api.github.com/repos/$SOURCE_OWNER/$SOURCE_REPO/tarball/${{ inputs.source_sha }}"
          tar -xzf source.tar.gz --strip-components=1 -C source
          rm -f source.tar.gz
          test -f source/package-lock.json
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Validate source version
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(node -p "require('./package.json').version")"
          test "${{ inputs.tag }}" = "$expected" || { echo "::error::tag must be $expected"; exit 1; }
      - name: Install locked dependencies
        working-directory: source
        run: npm ci
      - name: Build the WASM parity prerequisite
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          rustup target add wasm32-wasip1
          npm run build:atlas
          export RUSTFLAGS="--remap-path-prefix=$HOME=/build --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo"
          cargo build --release --target wasm32-wasip1 --manifest-path packages/atlas-core/native/cluster/Cargo.toml
          cp packages/atlas-core/native/cluster/target/wasm32-wasip1/release/cluster.wasm packages/atlas-core/dist/cluster.wasm
      - name: Windows HUD diagnostic preflight
        if: matrix.label == 'windows'
        working-directory: source
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: npm run test:hud
      - name: Full guard suite
        working-directory: source
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: ${{ matrix.label == 'linux' && 'xvfb-run -a npm test' || 'npm test' }}
      - name: Build application without publishing credentials
        working-directory: source
        run: npm run build
      - name: Validate embedded production account configuration
        working-directory: source
        run: node scripts/release-auth-guard.mjs
      - name: Provision Apple notarization key
        if: inputs.channel == 'public-beta' && matrix.label == 'macos'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          test -n "$APPLE_API_KEY_P8" || { echo '::error::Apple notarization key is missing'; exit 1; }
          key_path="$RUNNER_TEMP/apple-api-key.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
      - name: Package internal unsigned candidate
        if: inputs.channel == 'internal-unsigned'
        working-directory: source
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: node scripts/electron-builder-safe.cjs --${{ matrix.target }} --publish never
      - name: Package signed public candidate
        if: inputs.channel == 'public-beta'
        working-directory: source
        env:
          CSC_LINK: ${{ matrix.label == 'windows' && secrets.WIN_CSC_LINK || matrix.label == 'macos' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.label == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || matrix.label == 'macos' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.label == 'linux' && 'false' || 'true' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node scripts/electron-builder-safe.cjs --${{ matrix.target }} --publish never
      - name: Verify packaged contents
        working-directory: source
        run: npm run -s lint:releasesafety
      - name: Verify embedded update feed
        working-directory: source
        run: npm run -s lint:updatefeed
      - name: Smoke packaged application
        working-directory: source
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: ${{ matrix.label == 'linux' && 'xvfb-run -a npm run test:packagedverify' || 'npm run test:packagedverify' }}
      - name: Verify Windows signature
        if: inputs.channel == 'public-beta' && matrix.label == 'windows'
        working-directory: source
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer missing' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'Valid') { throw "Invalid Windows signature: $($signature.Status)" }
      - name: Verify macOS signature and notarization ticket
        if: inputs.channel == 'public-beta' && matrix.label == 'macos'
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          app_path=$(find dist -maxdepth 3 -name '*.app' -print -quit)
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
      - name: Installed upgrade smoke
        if: inputs.channel == 'public-beta' && matrix.label == 'windows'
        working-directory: source
        shell: pwsh
        run: ./scripts/upgrade-smoke.ps1 -CandidatePath (Get-ChildItem dist -Filter '*.exe' | Select-Object -First 1).FullName
      - name: Generate checksums and verification record
        working-directory: source
        shell: pwsh
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_PLATFORM: ${{ matrix.label }}
          RELEASE_SHA: ${{ inputs.source_sha }}
        run: |
          $assets = Get-ChildItem dist -File | Where-Object {
            $_.Extension -in '.exe','.dmg','.zip','.AppImage','.deb','.blockmap' -or
            ($_.Extension -eq '.yml' -and $_.Name -like 'latest*.yml')
          }
          if (-not $assets) { throw 'No release assets were generated' }
          $assets | ForEach-Object { "$(Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName | Select-Object -ExpandProperty Hash)  $($_.Name)" } |
            Set-Content -Encoding ascii "dist/SHA256SUMS-$env:RELEASE_PLATFORM.txt"
          $signed = $env:RELEASE_CHANNEL -eq 'public-beta' -and $env:RELEASE_PLATFORM -in @('windows','macos')
          @{
            schema = 1
            platform = $env:RELEASE_PLATFORM
            channel = $env:RELEASE_CHANNEL
            source_sha = $env:RELEASE_SHA.ToLowerInvariant()
            verified = $true
            signed = $signed
          } | ConvertTo-Json | Set-Content -Encoding utf8 "dist/verification-$env:RELEASE_PLATFORM.json"
      - name: Remove temporary Apple key
        if: always() && matrix.label == 'macos'
        shell: bash
        run: rm -f "$RUNNER_TEMP/apple-api-key.p8"
      - name: Upload unprivileged candidate outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-${{ matrix.label }}
          path: |
            source/dist/*.exe
            source/dist/*.dmg
            source/dist/*.zip
            source/dist/*.AppImage
            source/dist/*.deb
            source/dist/*.blockmap
            source/dist/latest*.yml
            source/dist/SHA256SUMS-*.txt
            source/dist/verification-*.json
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Create isolated draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - name: Check out protected controller logic
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Download all candidate outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: candidate-*
          path: staged
          merge-multiple: true
      - name: Assemble and independently validate manifest
        run: |
          node scripts/assemble-manifest.mjs staged "${{ inputs.tag }}" "${{ inputs.source_sha }}" "${{ inputs.channel }}" staged/release-manifest.json
          node scripts/validate-manifest.mjs staged/release-manifest.json staged "${{ inputs.tag }}" "${{ inputs.source_sha }}" "${{ inputs.channel }}"
      - name: Create draft prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${{ inputs.tag }}" >/dev/null 2>&1; then
            echo '::error::a release or draft already exists for this tag'
            exit 1
          fi
          warning=''
          if [ "${{ inputs.channel }}" = internal-unsigned ]; then
            warning=$'\n\nWARNING: Internal unsigned candidate. Windows SmartScreen and macOS Gatekeeper trust are not established. Do not redistribute.'
          fi
          notes="$(printf 'Source: clarityaui/main@%s\nChannel: %s\nController run: %s%s' '${{ inputs.source_sha }}' '${{ inputs.channel }}' '${{ github.run_id }}' "$warning")"
          mapfile -d '' assets < <(find staged -maxdepth 1 -type f -print0 | sort -z)
          test "${#assets[@]}" -gt 0
          gh release create "${{ inputs.tag }}" "${assets[@]}" --draft --prerelease \
            --title "Clarity AUI ${{ inputs.tag }} (${{ inputs.channel }})" --notes "$notes"
